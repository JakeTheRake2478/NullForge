<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NullForge</title>

  <link rel="icon" href="hammericon.ico" type="image/x-icon">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a002b, #000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 40px;
    }

    .brand {
      font-family: 'Audiowide', cursive;
      font-size: 3rem;
      color: #c084fc;
      text-shadow: 0 0 20px #a855f7;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #bbb;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(168,85,247,0.2);
      backdrop-filter: blur(10px);
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #a855f7;
      color: white;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #a855f7;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .count {
      margin-top: 15px;
      font-size: 1.2rem;
      color: #ddd;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container" id="top">
    <div class="brand">NullForge</div>
    <div class="subtitle">domain test interface ⚡</div>

    <div class="card">
      <p>
        Welcome.<br>
        This is a minimal test node for NullForge systems.<br><br>
        One interaction per day is allowed per device.
      </p>

      <button id="likeBtn">💜 Like</button>

      <div class="count">
        Total Likes: <span id="count">...</span> 🔥
      </div>
    </div>

    <div class="footer">
      📩 jacksandoval@nullforge.tech
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      increment
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAn4I8llFL8xYkqnQB0TlaSS0eM2RsTkaw",
      authDomain: "nullforgetech.firebaseapp.com",
      projectId: "nullforgetech",
      storageBucket: "nullforgetech.firebasestorage.app",
      messagingSenderId: "466898895436",
      appId: "1:466898895436:web:37ea68ea172143fbf46ae9",
      measurementId: "G-9CCBDJBNLC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ref = doc(db, "counter", "likes");

    const btn = document.getElementById("likeBtn");
    const countEl = document.getElementById("count");
    const top = document.getElementById("top");

    // 🔊 sound
    const ding = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

    async function load() {
      const snap = await getDoc(ref);
      countEl.innerText = snap.exists() ? snap.data().value : 0;
    }

    function canLikeToday() {
      const last = localStorage.getItem("lastLikeDay");
      const today = new Date().toDateString();
      return last !== today;
    }

    async function like() {
      if (!canLikeToday()) {
        alert("⛔ You already liked today!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Liking... 💜";

      await updateDoc(ref, {
        value: increment(1)
      });

      localStorage.setItem("lastLikeDay", new Date().toDateString());

      ding.play();

      // scroll effect (web app feel)
      window.scrollTo({ top: 0, behavior: "smooth" });

      btn.innerText = "Liked 💜";
      load();
    }

    btn.addEventListener("click", like);

    load();
  </script>
</body>
</html>
