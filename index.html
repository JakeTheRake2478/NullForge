  <style>
    :root {
      --bg-1: #05020a;
      --bg-2: #0d0618;
      --card: rgba(15, 18, 27, 0.9);
      --border: rgba(168, 85, 247, 0.35);
      --text: #f8f7ff;
      --muted: #b8a9d9;
      --purple: #9d4edd;
      --blue: #38bdf8;
      --cloudflare: #f38020;
      --cloudflare-light: #faae40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 4vw, 36px);
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(157, 78, 221, 0.28), transparent 34%),
        radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.14), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 55%, #020008);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      transform: rotate(-8deg);
      mask-image: radial-gradient(circle, black 30%, transparent 72%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: min(94vw, 720px);
      padding: clamp(22px, 5vw, 42px) clamp(16px, 4vw, 28px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: clamp(20px, 4vw, 28px);
      background: linear-gradient(180deg, rgba(20, 24, 36, 0.92), rgba(8, 8, 14, 0.92));
      box-shadow:
        0 0 55px rgba(157, 78, 221, 0.22),
        0 0 120px rgba(56, 189, 248, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 9px 15px;
      margin-bottom: clamp(14px, 3vw, 24px);
      border: 1px solid rgba(243, 128, 32, 0.35);
      border-radius: 999px;
      color: #ffd7b0;
      background: rgba(243, 128, 32, 0.10);
      font-size: clamp(0.72rem, 2.5vw, 0.92rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cf-logo {
      width: clamp(28px, 7vw, 34px);
      height: auto;
      flex: 0 0 auto;
      filter: drop-shadow(0 0 8px rgba(243, 128, 32, 0.35));
    }

    .hammer {
      width: min(42vh, 250px, 62vw);
      max-width: 100%;
      height: auto;
      margin: 4px auto clamp(12px, 3vw, 20px);
      display: block;
      object-fit: contain;
      filter:
        drop-shadow(0 0 18px rgba(157, 78, 221, 0.45))
        drop-shadow(0 0 36px rgba(56, 189, 248, 0.10));
      animation: floaty 4s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(1.6rem, 8vw, 4.7rem);
      line-height: 1;
      letter-spacing: -0.055em;
      margin-bottom: 12px;
      font-weight: 900;
      text-transform: lowercase;
      overflow-wrap: anywhere;
      background: linear-gradient(90deg, #ffffff, #d8b4fe 45%, #93c5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      max-width: 520px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      line-height: 1.55;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: clamp(16px, 4vw, 26px);
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.08);
      color: #d9f99d;
      font-size: clamp(0.82rem, 2.5vw, 0.95rem);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #84cc16;
      box-shadow: 0 0 14px #84cc16;
    }

    @keyframes floaty {
      0%, 100% {
        transform: translateY(0) rotate(-0.4deg);
      }

      50% {
        transform: translateY(-8px) rotate(0.4deg);
      }
    }

    @media (max-height: 650px) {
      body {
        align-items: flex-start;
      }

      .hammer {
        width: min(30vh, 180px, 52vw);
      }

      .card {
        padding-top: 20px;
        padding-bottom: 20px;
      }
    }

    @media (max-width: 520px) {
      .card {
        width: 100%;
      }

      .badge {
        max-width: 100%;
      }
    }
  </style>
</head>
