<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NullForge</title>

  <link rel="icon" href="hammericon.ico" type="image/x-icon">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 750px;
      padding: 40px;
    }

    h1 {
      font-size: 2.7rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #d4d4d4;
    }

    .counter {
      margin-top: 25px;
      font-size: 1.2rem;
      color: #aaa;
    }

    .footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #777;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      color: black;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>NullForge</h1>

    <p>
      This domain is currently being tested.<br><br>
      Nothing much here yet.
    </p>

    <button id="likeBtn">Like</button>

    <div class="counter">
      Total Likes: <span id="count">Loading...</span>
    </div>

    <div class="footer">
      Reach me at: jacksandoval@nullforge.tech
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      increment
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAn4I8llFL8xYkqnQB0TlaSS0eM2RsTkaw",
      authDomain: "nullforgetech.firebaseapp.com",
      projectId: "nullforgetech",
      storageBucket: "nullforgetech.firebasestorage.app",
      messagingSenderId: "466898895436",
      appId: "1:466898895436:web:37ea68ea172143fbf46ae9",
      measurementId: "G-9CCBDJBNLC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ref = doc(db, "counter", "likes");

    const countEl = document.getElementById("count");
    const btn = document.getElementById("likeBtn");

    async function loadCount() {
      const snap = await getDoc(ref);

      if (snap.exists()) {
        countEl.innerText = snap.data().value;
      } else {
        countEl.innerText = 0;
      }
    }

    async function like() {
      await updateDoc(ref, {
        value: increment(1)
      });

      loadCount();
    }

    btn.addEventListener("click", like);

    loadCount();
  </script>
</body>
</html>
