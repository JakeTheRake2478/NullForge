<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NullForge Domain Test</title>

  <style>
    /*
      Single-file domain test page.
      Fonts: uses local/system fonts so the HTML stays self-contained.
      You can rename this file to index.html and upload it to your domain.
    */

    :root {
      --bg-1: #05020a;
      --bg-2: #0e0618;
      --card: rgba(15, 18, 27, 0.82);
      --border: rgba(168, 85, 247, 0.35);
      --text: #f8f7ff;
      --muted: #b8a9d9;
      --purple: #9d4edd;
      --blue: #38bdf8;
      --cloudflare: #f38020;
      --cloudflare-dark: #faae40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(157, 78, 221, 0.26), transparent 34%),
        radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.12), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 55%, #020008);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      transform: rotate(-8deg);
      mask-image: radial-gradient(circle, black 30%, transparent 72%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: min(92vw, 720px);
      padding: 42px 28px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(20, 24, 36, 0.9), rgba(8, 8, 14, 0.9));
      box-shadow:
        0 0 55px rgba(157, 78, 221, 0.20),
        0 0 120px rgba(56, 189, 248, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 15px;
      margin-bottom: 24px;
      border: 1px solid rgba(243, 128, 32, 0.35);
      border-radius: 999px;
      color: #ffd7b0;
      background: rgba(243, 128, 32, 0.10);
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cf-logo {
      width: 34px;
      height: 22px;
      flex: 0 0 auto;
      filter: drop-shadow(0 0 8px rgba(243, 128, 32, 0.35));
    }

    .hammer {
      width: min(250px, 62vw);
      height: auto;
      margin: 4px auto 20px;
      display: block;
      filter:
        drop-shadow(0 0 18px rgba(157, 78, 221, 0.45))
        drop-shadow(0 0 36px rgba(56, 189, 248, 0.10));
      animation: floaty 4s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4.7rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      margin-bottom: 12px;
      font-weight: 900;
      text-transform: lowercase;
      background: linear-gradient(90deg, #ffffff, #d8b4fe 45%, #93c5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      max-width: 520px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.08);
      color: #d9f99d;
      font-size: 0.95rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #84cc16;
      box-shadow: 0 0 14px #84cc16;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-0.4deg); }
      50% { transform: translateY(-10px) rotate(0.4deg); }
    }

    @media (max-width: 520px) {
      .card {
        padding: 34px 18px;
        border-radius: 22px;
      }

      .badge {
        font-size: 0.78rem;
      }
    }
  </style>
</head>
